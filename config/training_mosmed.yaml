TRAIN:
  train_batch_size: 32
  lr: 0.0003

  valid_batch_size: 8

  image_size: [224,224]

  min_epochs: 20
  max_epochs: 100
  patience: 30

  device: 1

  model_save_path: ./save_model_mosmed
  model_save_filename: medseg
  best_model_path: ./save_model_mosmed/medseg-v20.ckpt

TEACHER:
  techer_model_path: ./save_model_mosmed_teacher/medseg-v20.ckpt

MAPPER:
  pretrained_mapper_path: ./save_mapper_mosmed/mapper.pt

MODEL:
  bert_type: microsoft/BiomedVLP-CXR-BERT-specialized
  vision_type: facebook/convnext-tiny-224
  project_dim: 768

  dropout_prob: 0.4
  alpha: 0.7
  alignment_loss_weight: 0.1

DATA:
  data: MosMedPlus
  train_csv_path: ./data/MosMedData+/prompt/train.csv
  train_root_path: ./data/MosMedData+/Train

  val_csv_path: ./data/MosMedData+/prompt/val.csv
  val_root_path: ./data/MosMedData+/Val

  test_csv_path: ./data/MosMedData+/prompt/test.csv
  test_root_path: ./data/MosMedData+/Test

LOSS:
  # Loss function weights
  lambda_token: 1.0         # Token-level cosine similarity
  lambda_global: 0.5        # Global cosine similarity
  lambda_diversity: 0.1     # Diversity regularization
  lambda_contrastive: 0.2   # Contrastive learning
  temperature: 0.07         # Temperature for contrastive loss

  # Distillation weights
  lambda_distill_os16: 1.0
  lambda_distill_os8: 1.0
  lambda_distill_os4: 1.0