TRAIN:
  train_batch_size: 32
  lr: 0.0003

  valid_batch_size: 8

  image_size: [224,224]

  min_epochs: 20
  max_epochs: 200
  patience: 30

  device: 1
  text_length: 24

  model_save_path: /raid/tphung/workspace-Duy/LanGuideMedSeg-MICCAI2023/save_model_mosmed_baseline_kd
  model_save_filename: medseg
  best_model_path: /raid/tphung/workspace-Duy/LanGuideMedSeg-MICCAI2023/save_model_mosmed_baseline_kd/medseg-v13.ckpt

  wrapper: BaselineKD
  mode: Training

TEACHER:
  teacher_model_path: /raid/tphung/workspace-Duy/LanGuideMedSeg-MICCAI2023/save_model_mosmed_teacher/medseg-v1.ckpt

MODEL:
  bert_type: microsoft/BiomedVLP-CXR-BERT-specialized
  vision_type: facebook/convnext-tiny-224
  project_dim: 768

DATA:
  data: MosMedPlus
  train_csv_path: ./data/MosMedData+/prompt/train.csv
  train_root_path: ./data/MosMedData+/Train

  val_csv_path: ./data/MosMedData+/prompt/val.csv
  val_root_path: ./data/MosMedData+/Val

  test_csv_path: ./data/MosMedData+/prompt/test.csv
  test_root_path: ./data/MosMedData+/Test

LOSS:
  # Distillation weights
  lambda_distill_os16: 1
  lambda_distill_os8: 1
  lambda_distill_os4: 1
  lambda_distill: 1
  lambda_multi_temp: 1